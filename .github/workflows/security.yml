name: APXOR Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Check for accidentally tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^/]+)$' | grep -v '^\.env\.example$'; then
            echo "A non-example environment file is tracked. Remove secrets before merging."
            exit 1
          fi
